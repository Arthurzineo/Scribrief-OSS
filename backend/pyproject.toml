[project]
name = "ia-projeto-audio-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<6",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "celery[redis]>=5.5,<6",
  "psycopg[binary]>=3.2,<4",
  "openai>=2,<3",
  "argon2-cffi>=23,<26",
  "django-axes>=8,<9",
  "django-cors-headers>=4,<5",
  "gunicorn>=23,<24",
  "drf-spectacular-sidecar>=2026.10.1",
  "whitenoise>=6,<8",
  "cryptography>=50,<51",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-django>=4,<5",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
