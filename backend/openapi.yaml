      - Conta
      operationId: get_account
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Dados da conta
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      is_staff:
                        type: boolean
                      must_change_password:
                        type: boolean
                    required:
                    - id
                    - username
                    - is_staff
                    - must_change_password
                required:
                - user
    patch:
      tags:
      - Conta
      operationId: update_account
      security:
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      is_staff:
                        type: boolean
                      must_change_password:
                        type: boolean
                    required:
                    - id
                    - username
                    - is_staff
                    - must_change_password
                required:
                - user
  /api/v1/account/password/:
    post:
      tags:
      - Conta
      operationId: change_password
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
              required:
              - currentPassword
              - newPassword
      responses:
        '200':
          description: Senha atualizada; libera o primeiro acesso quando obrigatório
        '400':
          description: Senha atual incorreta ou nova senha inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
