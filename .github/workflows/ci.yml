name: Verificação beta

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar segredos no histórico completo
        run: docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git --redact --config /repo/.gitleaks.toml /repo

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: scribrief_ci
          POSTGRES_USER: scribrief_ci
          POSTGRES_PASSWORD: synthetic-ci-only-not-a-deployment-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scribrief_ci -d scribrief_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.12.19'
      - run: uv sync --frozen --python 3.12
        working-directory: backend
      - run: uv run python manage.py collectstatic --noinput
        working-directory: backend
        env:
          DJANGO_TESTING: '1'
      - run: uv run pytest -q --tb=short
        working-directory: backend
        env:
          DJANGO_TESTING: '1'
      - run: uv run ruff check .
        working-directory: backend
      - name: Suíte e concorrência real no PostgreSQL isolado
        run: uv run pytest -q --tb=short
        working-directory: backend
        env:
          DJANGO_TESTING: '1'
          DATABASE_HOST: '127.0.0.1'
          DATABASE_PORT: '5432'
          DATABASE_NAME: scribrief_ci
          DATABASE_USER: scribrief_ci
          DATABASE_PASSWORD: synthetic-ci-only-not-a-deployment-secret
      - run: uv run python manage.py spectacular --validate --file openapi.yaml
        working-directory: backend
        env:
          DJANGO_TESTING: '1'
      - run: uvx pip-audit -r backend/requirements.txt --disable-pip

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Orçamento administrativo e exportações PNG/PDF sintéticas
        run: npm run test:alpha
        working-directory: frontend
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  instalacao-linux:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalação isolada com TLS autoassinado e sem credenciais OpenAI
        run: bash deploy/install.sh
      - name: Conta inicial restrita e nenhuma conta demo
        run: |
          docker compose --env-file deploy/beta.env -f compose.beta.yaml exec -T backend python -c '
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          django.setup()
          from django.contrib.auth import get_user_model
          User = get_user_model()
          admin = User.objects.get(username="ADMIN")
          assert User.objects.count() == 1
          assert admin.is_superuser and admin.is_staff
          assert admin.check_password("ADMIN123") and admin.membership.must_change_password
          assert not User.objects.filter(username="demo").exists()
          '
      - name: Primeiro login real exige troca e libera painel somente depois
        run: |
          jar="$(mktemp)"
          trap 'rm -f "$jar"' EXIT
          base='https://127.0.0.1:18575'
          curl -ksS -c "$jar" "$base/api/v1/csrf/" >/dev/null
          csrf="$(awk '$6 == "csrftoken" {print $7}' "$jar")"
          test -n "$csrf"
          test "$(curl -ksS -b "$jar" -c "$jar" -H "Origin: $base" -H "X-CSRFToken: $csrf" -H 'Content-Type: application/json' -d '{"username":"ADMIN","password":"ADMIN123"}' -o /dev/null -w '%{http_code}' "$base/api/v1/login/")" = 200
          test "$(curl -ksS -b "$jar" -o /dev/null -w '%{http_code}' "$base/api/admin/sectors/")" = 403
          csrf="$(awk '$6 == "csrftoken" {print $7}' "$jar")"
          test "$(curl -ksS -b "$jar" -c "$jar" -H "Origin: $base" -H "X-CSRFToken: $csrf" -H 'Content-Type: application/json' -d '{"currentPassword":"ADMIN123","newPassword":"Temporary-CI-Strong-Password-456"}' -o /dev/null -w '%{http_code}' "$base/api/v1/account/password/")" = 200
          test "$(curl -ksS -b "$jar" -o /dev/null -w '%{http_code}' "$base/api/admin/sectors/")" = 200
      - name: Usuário criado pelo admin deve trocar senha antes de usar a LAN
        run: |
          admin_jar="$(mktemp)"
          user_jar="$(mktemp)"
          trap 'rm -f "$admin_jar" "$user_jar"' EXIT
          admin_base='https://127.0.0.1:18575'
          public_base='https://127.0.0.1:18574'
          curl -ksS -c "$admin_jar" "$admin_base/api/v1/csrf/" >/dev/null
          csrf="$(awk '$6 == "csrftoken" {print $7}' "$admin_jar")"
          test "$(curl -ksS -b "$admin_jar" -c "$admin_jar" -H "Origin: $admin_base" -H "X-CSRFToken: $csrf" -H 'Content-Type: application/json' -d '{"username":"ADMIN","password":"Temporary-CI-Strong-Password-456"}' -o /dev/null -w '%{http_code}' "$admin_base/api/v1/login/")" = 200
          csrf="$(awk '$6 == "csrftoken" {print $7}' "$admin_jar")"
          sector="$(curl -ksS -b "$admin_jar" -c "$admin_jar" -H "Origin: $admin_base" -H "X-CSRFToken: $csrf" -H 'Content-Type: application/json' -d '{"name":"Setor de teste","slug":"setor-de-teste"}' "$admin_base/api/admin/sectors/")"
          sector_id="$(printf '%s' "$sector" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          test -n "$sector_id"
          test "$(curl -ksS -b "$admin_jar" -c "$admin_jar" -H "Origin: $admin_base" -H "X-CSRFToken: $csrf" -H 'Content-Type: application/json' -d "{\"username\":\"ci_user\",\"password\":\"Safe-Temporary-Password-789\",\"sector_id\":$sector_id}" -o /dev/null -w '%{http_code}' "$admin_base/api/admin/users/")" = 201
          curl -ksS -c "$user_jar" "$public_base/api/v1/csrf/" >/dev/null
          csrf="$(awk '$6 == "csrftoken" {print $7}' "$user_jar")"
          test "$(curl -ksS -b "$user_jar" -c "$user_jar" -H "Origin: $public_base" -H "X-CSRFToken: $csrf" -H 'Content-Type: application/json' -d '{"username":"ci_user","password":"Safe-Temporary-Password-789"}' -o /dev/null -w '%{http_code}' "$public_base/api/v1/login/")" = 200
          test "$(curl -ksS -b "$user_jar" -o /dev/null -w '%{http_code}' "$public_base/api/v1/meetings/")" = 403
          test "$(curl -ksS -b "$user_jar" -o /dev/null -w '%{http_code}' "$public_base/primeiro-acesso/")" = 200
          csrf="$(awk '$6 == "csrftoken" {print $7}' "$user_jar")"
          test "$(curl -ksS -b "$user_jar" -c "$user_jar" -H "Origin: $public_base" -H "X-CSRFToken: $csrf" -H 'Content-Type: application/json' -d '{"currentPassword":"Safe-Temporary-Password-789","newPassword":"A-New-Private-Password-456"}' -o /dev/null -w '%{http_code}' "$public_base/api/v1/account/password/")" = 200
          test "$(curl -ksS -b "$user_jar" -o /dev/null -w '%{http_code}' "$public_base/api/v1/meetings/")" = 200
      - name: Permissões dos diretórios sensíveis no host
        run: |
          test "$(stat -c %a deploy/secrets)" = 700
          test "$(stat -c %a deploy/certs)" = 700
          test "$(stat -c %a deploy/secrets/django_secret)" = 644
          docker compose --env-file deploy/beta.env -f compose.beta.yaml exec -T backend \
            python -c 'import os,stat; p="/app/tls/current.pem"; assert stat.S_IMODE(os.stat(p).st_mode)==0o640; assert stat.S_IMODE(os.stat("/app/tls").st_mode)==0o750; assert os.stat(p).st_gid==101'
          openssl s_client -connect 127.0.0.1:18574 -servername 127.0.0.1 </dev/null 2>/dev/null | \
            openssl x509 -noout -ext subjectAltName | grep -q 'IP Address:127.0.0.1'
      - name: Rede pública, API e admin isolado
        run: |
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:18574/api/v1/csrf/)" = 200
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:18574/admin/)" = 404
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:18575/api/docs/)" = 403
          docker compose --env-file deploy/beta.env -f compose.beta.yaml ps
      - name: Diagnóstico em falha
        if: failure()
        run: docker compose --env-file deploy/beta.env -f compose.beta.yaml logs --tail=100 || true
      - name: Limpeza do runner efêmero
        if: always()
        run: docker compose --env-file deploy/beta.env -f compose.beta.yaml down -v || true
