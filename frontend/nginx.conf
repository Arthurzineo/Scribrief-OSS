server {
    listen 8080;
    server_name _;
    location = /healthz { return 200 "ok"; }
    location / { return 308 https://$host:18574$request_uri; }
}

server {
    listen 8443 ssl;
    server_name _;
    # Resolve o backend novamente após recriações do contêiner pelo Compose.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:8000;
    ssl_certificate /etc/nginx/certs/current.pem;
    ssl_certificate_key /etc/nginx/certs/current.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # File cap is 5 GiB in Django; allow multipart overhead at the proxy.
    client_max_body_size 5121m;
    client_body_timeout 3600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }
    # Documentation is administrative only; no redirect/discovery on public port.
    location = /api/schema { return 404; }
    location = /api/schema/ { return 404; }
    location = /api/docs { return 404; }
    location = /api/docs/ { return 404; }
    location ^~ /static/drf_spectacular_sidecar/ { return 404; }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /health/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
    }

    location = /assets/app.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location = /assets/style.css {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Administrative listener: bind its host port only on ADMIN_BIND_IP.  Network
# isolation is additive; the Django endpoints still check authenticated staff.
server {
    listen 9443 ssl;
    server_name _;
    # Preserve the externally published admin port on the /admin redirect.
    absolute_redirect off;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:8000;
    ssl_certificate /etc/nginx/certs/current.pem;
    ssl_certificate_key /etc/nginx/certs/current.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /admin { return 308 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /assets/app.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location = /assets/style.css {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location ^~ /assets/ { try_files $uri =404; expires 1y; }

    location ^~ /api/admin/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/api/(schema|docs)/$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Swagger UI uses self-hosted sidecar files; expose these only here.
    location ^~ /static/drf_spectacular_sidecar/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/api/v1/(csrf|login|logout|session|account/password)/$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
